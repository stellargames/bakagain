# Pull requests, manual runs and every release: the .NET libraries and their tests, then the Unity
# project's tests. Nothing here has the original game's data, so tests that need it skip.
#
# A release runs this through workflow_call (release.yml's tests job), and publishes only when it
# passes; so a version tag does not trigger it a second time on its own.
#
# Unity needs a licence to run: repo secrets UNITY_LICENSE (the .ulf of a Personal licence),
# UNITY_EMAIL and UNITY_PASSWORD. Fork pull requests do not get secrets, so their Unity job is
# skipped and only the .NET job reports.
#
# No player build here (owner's call, 2026-09-29): the Unity job already compiles every script, and
# player-only breakage (an #if UNITY_EDITOR slip, code stripping) is caught by release.yml, which
# builds all three players on a tag or a manual dry run, before anything ships.
name: CI

on:
  # Not on every push to main (owner's call, 2026-09-27): pull requests, releases and manual runs
  # only. Pushes to main are tested when a PR or a release brings them in.
  pull_request:
    # Site, docs, format specs and licence texts are not built or tested.
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'unity/docs/**'
      - 'formats/**'
      - '**/*.md'
      - 'LICENSE*'
  workflow_call:
    # Named, not inherited: the release's Android signing secrets have no business in a test run.
    secrets:
      UNITY_LICENSE: { required: false }
      UNITY_EMAIL: { required: false }
      UNITY_PASSWORD: { required: false }
  workflow_dispatch:

concurrency:
  # The workflow's name is the caller's when called, so a release's tests and a manual CI run on the
  # same ref do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x  # global.json pins 10.0.0, not a real SDK version; setup-dotnet takes it literally
      - run: dotnet build src/ResourceExtraction/ResourceExtraction.csproj -c Unity
      - run: dotnet test src/BakAgain.slnx

  # Two runs of the same suite. The runner has no GPU, so Unity renders in software (Mesa llvmpipe) at
  # ~1.65 s a frame: the whole suite took 1270 s that way and 8.9 s with -nographics (TASK-875). So
  # everything runs without graphics except the tests tagged Category("Graphics"), which read what
  # the GPU drew and get their own, small run with the software renderer.
  unity-tests:
    needs: dotnet
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: no-graphics, args: '-nographics -testCategory !Graphics' }
          - { name: graphics, args: '-testCategory Graphics' }
    name: unity-tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x  # global.json pins 10.0.0, not a real SDK version; setup-dotnet takes it literally
      - name: Build the plugin libraries into the Unity project
        run: dotnet build src/ResourceExtraction/ResourceExtraction.csproj -c Unity
      - uses: actions/cache@v6
        with:
          path: unity/Library
          key: Library-tests-${{ matrix.name }}-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-tests-${{ matrix.name }}-
      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          testMode: playmode
          customParameters: ${{ matrix.args }}
          checkName: Test Results (${{ matrix.name }})
          githubToken: ${{ secrets.GITHUB_TOKEN }}
