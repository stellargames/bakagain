# Pull requests, version tags and manual runs: the .NET libraries and their tests, then the Unity
# project's tests. Nothing here has the original game's data, so tests that need it skip.
#
# Unity needs a licence to run: repo secrets UNITY_LICENSE (the .ulf of a Personal licence),
# UNITY_EMAIL and UNITY_PASSWORD. Fork pull requests do not get secrets, so their Unity job is
# skipped and only the .NET job reports.
name: CI

on:
  # Not on every push to main (owner's call, 2026-09-27): pull requests, version tags and manual
  # runs only. Pushes to main are tested when a PR or a tag brings them in.
  pull_request:
    # Site, docs, format specs and licence texts are not built or tested.
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'unity/docs/**'
      - 'formats/**'
      - '**/*.md'
      - 'LICENSE*'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x  # global.json pins 10.0.0, not a real SDK version; setup-dotnet takes it literally
      - run: dotnet build src/ResourceExtraction/ResourceExtraction.csproj -c Unity
      - run: dotnet test src/BakAgain.slnx

  unity-tests:
    needs: dotnet
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x  # global.json pins 10.0.0, not a real SDK version; setup-dotnet takes it literally
      - name: Build the plugin libraries into the Unity project
        run: dotnet build src/ResourceExtraction/ResourceExtraction.csproj -c Unity
      - uses: actions/cache@v6
        with:
          path: unity/Library
          key: Library-tests-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-tests-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          testMode: playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
