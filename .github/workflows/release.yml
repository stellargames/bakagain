# A tag v* builds Windows, Linux and Android, runs the tests (ci.yml), and only when both pass
# publishes the players as a GitHub Release. Tags with a hyphen (v0.1.0-alpha) become pre-releases.
#
# Secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (as ci.yml), and for Android
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS.
# Lose the keystore and installed copies can no longer be updated in place, so keep it backed up.
name: Release

on:
  push:
    tags: ['v*']
  # A manual run builds all three players as workflow artifacts and publishes nothing: the dry run.
  workflow_dispatch:

# Read-only by default; only publish writes (the release and the website commit).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # IL2CPP builds for Windows only on Windows.
          - { target: StandaloneWindows64, os: windows-2022, artifact: windows-x64 }
          - { target: StandaloneLinux64, os: ubuntu-latest, artifact: linux-x64 }
          - { target: Android, os: ubuntu-latest, artifact: android }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versioning: Tag reads the tag
      - name: Free disk space for the Android toolchain
        if: matrix.target == 'Android'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          dotnet: false # the plugin build below uses the runner's preinstalled SDK
      # No setup-dotnet: the runner images ship .NET 10 SDKs, which src/global.json accepts. Its download
      # host returned 409 for every version on 2026-10-25 (actions/setup-dotnet#794).
      - name: Build the plugin libraries into the Unity project
        run: dotnet build src/ResourceExtraction/ResourceExtraction.csproj -c Unity
      - uses: actions/cache@v6
        with:
          path: unity/Library
          key: Library-${{ matrix.target }}-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.target }}-
      - name: Start Docker on Windows
        # windows-2022 does not always have the Docker service running; unity-builder needs it.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Service docker
          docker version --format '{{.Server.Version}}'
      # v6 (a rewrite over game-ci/cli) reported a successful build as failed: exit 1 right after
      # 'Build succeeded' (run 36324723733, 2026-09-27). v5 runs on Node 24 too.
      - uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: ${{ matrix.target }}
          buildName: BaK-Again
          buildMethod: BakAgain.Editor.Build.ReleaseBuild.Run
          versioning: ${{ github.ref_type == 'tag' && 'Tag' || 'Semantic' }}
          androidExportType: androidPackage
          androidKeystoreName: bak-again.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.target }}
          # Dry-run builds only; a tag's builds live on as Release assets.
          retention-days: 7

  # The same tests a pull request runs (ci.yml), alongside the player builds: a failing test publishes
  # nothing and leaves the website on the previous release.
  tests:
    uses: ./.github/workflows/ci.yml
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    permissions:
      contents: read
      checks: write   # unity-test-runner reports its results as a check

  publish:
    needs: [build, tests]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir dist
          tag="${GITHUB_REF_NAME}"
          # Unity writes debug symbols beside the player in *_DoNotShip folders, and IL2CPP leaves its
          # generated C++ in *_BackUpThisFolder_ButDontShipItWithYourGame (829 MB on Linux).
          find artifacts -depth -type d \( -name '*_DoNotShip' -o -name '*_ButDontShipItWithYourGame' \) -exec rm -rf {} +
          (cd artifacts/windows-x64 && zip -qr "../../dist/BaK-Again-${tag}-windows-x64.zip" .)
          # Artifacts do not keep the executable bit; the player and its launcher need it back.
          find artifacts/linux-x64 -maxdepth 1 -type f ! -name '*.so' -exec chmod +x {} +
          (cd artifacts/linux-x64 && zip -qr "../../dist/BaK-Again-${tag}-linux-x64.zip" .)
          cp artifacts/android/*.apk "dist/BaK-Again-${tag}.apk"
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
      # The site links the files directly (/releases/latest skips pre-releases), so point it at this
      # release. The VPS pulls website/ from main.
      - uses: actions/checkout@v7
        with:
          ref: main
          path: repo
      - name: Point the website at this release
        working-directory: repo
        run: |
          website/set-release.sh "${GITHUB_REF_NAME}" ../dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A re-run for the same tag finds the page already pointing here.
          if ! git diff --quiet; then
            git commit -am "Website: downloads point at ${GITHUB_REF_NAME}"
            git push
          fi
      # Cloudflare keeps the home page up to 10 minutes, so v0.3.1-beta's page said v0.3.0-beta after the release.
      # Once the VPS serves the new page (it pulls main every 5 minutes), drop Cloudflare's copy.
      # CLOUDFLARE_PURGE_TOKEN: an API token with only Zone > Cache Purge on bakagain.org. Without it, skipped.
      - name: Purge the home page from Cloudflare's cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CF_ZONE: a26f3858a496c8a163c23a1b95506a93 # bakagain.org
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "no CLOUDFLARE_PURGE_TOKEN, skipped"; exit 0; fi
          # A fresh query string misses the cache, so this reads what the VPS serves now.
          for i in $(seq 1 40); do
            curl -fsS "https://bakagain.org/?release-check=$RANDOM$i" | grep -q "data-release=\"${GITHUB_REF_NAME}\"" && break
            sleep 30
          done
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"files":["https://bakagain.org/","https://bakagain.org/index.html"]}' | grep -q '"success":true'
